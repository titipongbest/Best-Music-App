name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-24.04 มี Android SDK ติดตั้งมาให้แล้ว
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # ใช้นับเลขเวอร์ชันจากจำนวน commit
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ไม่พบ secret KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check keystore
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }} # ใช้แสดงเฉพาะ "ชื่อ" secret เมื่อหาไม่เจอ
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            names=$(printf '%s' "$ALL_SECRETS" | jq -r 'keys | map(select(. != "github_token")) | join(", ")')
            echo "::error::ไม่พบ secret KEYSTORE_PASSWORD (secret ที่มีอยู่: $names)"
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::เปิด keystore ไม่ได้: $(grep -iE 'error|exception' "$RUNNER_TEMP/ks.txt" | head -1)"
            exit 1
          fi
          echo "::notice::keystore OK, aliases: $(grep -oE '^[^,]+, ' "$RUNNER_TEMP/ks.txt" | tr -d ',' | tr '\n' ' ')"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            msg=$( (grep -A25 "What went wrong" build.log || tail -n 30 build.log) | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit $code
          fi

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "DN|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: BestMusic-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
